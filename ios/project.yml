# The ySF app for the redesign, in SwiftUI — laid out like ysffantasy's ios/ (XcodeGen, Theme/,
# Services/, Models/, Views/Tabs, Views/Components) so the two can be swapped or merged.
# Regenerate the Xcode project with:  xcodegen generate
name: ySF
options:
  bundleIdPrefix: com.dylanjferrante.ysf
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
targets:
  ySF:
    type: application
    platform: iOS
    sources:
      - path: ySF
    settings:
      GENERATE_INFOPLIST_FILE: YES
      # partial plist merged into the generated one — carries only UIAppFonts
      INFOPLIST_FILE: ySF/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: ySF
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_STRICT_CONCURRENCY: minimal
